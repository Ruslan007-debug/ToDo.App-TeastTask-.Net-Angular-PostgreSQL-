<div class="auth-page">
  <div class="auth-card">

    <h1>Welcome back</h1>

    <p class="subtitle">
      Login to continue to your To-Do list
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="request.email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="request.password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

      @if (errorMessage) {
        <p class="error-message">
          {{ errorMessage }}
        </p>
      }

    </form>

    <p class="switch-page">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>
</div>
